<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kid Genius World</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Comic Neue', cursive;
        overflow: hidden; /* Prevent scroll on the main world view */
        background-color: #e0f2fe;
      }
      h1, h2, h3, button {
        font-family: 'Fredoka', sans-serif;
      }
      /* 3D Transforms */
      .world-perspective {
        perspective: 1200px;
      }
      .world-plane {
        transform-style: preserve-3d;
        transform: rotateX(30deg) translateY(-50px) scale(0.9);
        transition: transform 0.5s ease;
      }
      .room-card {
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        transform-style: preserve-3d;
      }
      .room-card:hover {
        transform: translateY(-20px) scale(1.05);
      }
      .floating {
        animation: float 3s ease-in-out infinite;
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }

      /* ========================================
         WELCOME SCREEN ANIMATIONS
         ======================================== */

      /* Floating animation */
      .animate-float {
        animation: floatGentle 4s ease-in-out infinite;
      }
      .animate-float-delayed {
        animation: floatGentle 4s ease-in-out infinite;
        animation-delay: 1s;
      }
      @keyframes floatGentle {
        0%, 100% { transform: translateY(0) translateX(0); }
        25% { transform: translateY(-8px) translateX(3px); }
        50% { transform: translateY(-15px) translateX(0); }
        75% { transform: translateY(-8px) translateX(-3px); }
      }

      /* Cloud drift animation */
      .animate-cloud-drift {
        animation: cloudDrift 25s linear infinite;
      }
      .animate-cloud-drift-slow {
        animation: cloudDrift 40s linear infinite;
      }
      .animate-cloud-drift-fast {
        animation: cloudDrift 18s linear infinite;
      }
      @keyframes cloudDrift {
        0% { transform: translateX(-100px); opacity: 0; }
        10% { opacity: 0.7; }
        90% { opacity: 0.7; }
        100% { transform: translateX(calc(100vw + 100px)); opacity: 0; }
      }

      /* Bee flying animation - figure 8 pattern */
      .animate-bee {
        animation: beeFly 8s ease-in-out infinite;
      }
      .animate-bee-2 {
        animation: beeFly2 10s ease-in-out infinite;
        animation-delay: 2s;
      }
      .animate-bee-3 {
        animation: beeFly3 12s ease-in-out infinite;
        animation-delay: 4s;
      }
      @keyframes beeFly {
        0% { transform: translate(0, 0) rotate(0deg); }
        25% { transform: translate(80px, -40px) rotate(15deg); }
        50% { transform: translate(160px, 0) rotate(0deg); }
        75% { transform: translate(80px, 40px) rotate(-15deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
      }
      @keyframes beeFly2 {
        0% { transform: translate(0, 0) rotate(0deg) scale(1); }
        25% { transform: translate(-60px, 30px) rotate(-10deg) scale(1.1); }
        50% { transform: translate(-120px, 0) rotate(0deg) scale(1); }
        75% { transform: translate(-60px, -30px) rotate(10deg) scale(0.9); }
        100% { transform: translate(0, 0) rotate(0deg) scale(1); }
      }
      @keyframes beeFly3 {
        0% { transform: translate(0, 0) rotate(5deg); }
        33% { transform: translate(100px, -60px) rotate(-5deg); }
        66% { transform: translate(50px, 60px) rotate(5deg); }
        100% { transform: translate(0, 0) rotate(5deg); }
      }

      /* Butterfly flutter animation */
      .animate-butterfly {
        animation: butterflyFly 15s ease-in-out infinite;
      }
      .animate-butterfly-2 {
        animation: butterflyFly2 18s ease-in-out infinite;
        animation-delay: 3s;
      }
      .animate-butterfly-3 {
        animation: butterflyFly3 20s ease-in-out infinite;
        animation-delay: 6s;
      }
      @keyframes butterflyFly {
        0% { transform: translate(0, 0) rotate(0deg) scale(1); }
        10% { transform: translate(30px, -20px) rotate(5deg) scale(1.05); }
        20% { transform: translate(80px, -10px) rotate(-3deg) scale(0.95); }
        30% { transform: translate(120px, -40px) rotate(8deg) scale(1.1); }
        40% { transform: translate(160px, -20px) rotate(-5deg) scale(1); }
        50% { transform: translate(200px, -50px) rotate(3deg) scale(1.05); }
        60% { transform: translate(160px, -80px) rotate(-8deg) scale(0.9); }
        70% { transform: translate(100px, -60px) rotate(5deg) scale(1); }
        80% { transform: translate(50px, -30px) rotate(-3deg) scale(1.1); }
        90% { transform: translate(20px, -10px) rotate(5deg) scale(0.95); }
        100% { transform: translate(0, 0) rotate(0deg) scale(1); }
      }
      @keyframes butterflyFly2 {
        0% { transform: translate(0, 0) rotate(0deg); }
        25% { transform: translate(-80px, -50px) rotate(-10deg); }
        50% { transform: translate(-150px, 20px) rotate(5deg); }
        75% { transform: translate(-80px, -30px) rotate(-5deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
      }
      @keyframes butterflyFly3 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        20% { transform: translate(50px, -80px) scale(1.2); }
        40% { transform: translate(-30px, -120px) scale(0.8); }
        60% { transform: translate(80px, -60px) scale(1.1); }
        80% { transform: translate(20px, -20px) scale(0.9); }
      }

      /* Sun glow and pulse */
      .sun-glow {
        animation: sunPulse 4s ease-in-out infinite;
        filter: drop-shadow(0 0 20px rgba(255, 200, 0, 0.8))
                drop-shadow(0 0 40px rgba(255, 150, 0, 0.6))
                drop-shadow(0 0 60px rgba(255, 100, 0, 0.4));
      }
      @keyframes sunPulse {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 20px rgba(255, 200, 0, 0.8))
                  drop-shadow(0 0 40px rgba(255, 150, 0, 0.6))
                  drop-shadow(0 0 60px rgba(255, 100, 0, 0.4));
        }
        50% {
          transform: scale(1.05);
          filter: drop-shadow(0 0 30px rgba(255, 200, 0, 1))
                  drop-shadow(0 0 60px rgba(255, 150, 0, 0.8))
                  drop-shadow(0 0 90px rgba(255, 100, 0, 0.5));
        }
      }

      /* Sun rays rotation */
      .sun-rays {
        animation: sunRaysRotate 30s linear infinite;
      }
      @keyframes sunRaysRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Individual ray shimmer */
      .sun-ray {
        animation: rayShimmer 2s ease-in-out infinite;
      }
      @keyframes rayShimmer {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }

      /* Sparkle animation */
      .animate-sparkle {
        animation: sparkle 1.5s ease-in-out infinite;
      }
      @keyframes sparkle {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }

      /* Bird flying */
      .animate-bird {
        animation: birdFly 8s linear infinite;
      }
      @keyframes birdFly {
        0% { transform: translateX(-50px) translateY(0); }
        25% { transform: translateX(25vw) translateY(-20px); }
        50% { transform: translateX(50vw) translateY(0); }
        75% { transform: translateX(75vw) translateY(-15px); }
        100% { transform: translateX(100vw) translateY(0); }
      }

      /* Flower sway */
      .animate-sway {
        animation: flowerSway 3s ease-in-out infinite;
        transform-origin: bottom center;
      }
      @keyframes flowerSway {
        0%, 100% { transform: rotate(-3deg); }
        50% { transform: rotate(3deg); }
      }

      /* Rainbow shimmer */
      .animate-rainbow {
        animation: rainbowShimmer 5s ease-in-out infinite;
      }
      @keyframes rainbowShimmer {
        0%, 100% { opacity: 0.2; filter: saturate(1); }
        50% { opacity: 0.5; filter: saturate(1.5); }
      }

      /* Title bounce */
      .animate-title-bounce {
        animation: titleBounce 2s ease-in-out infinite;
      }
      @keyframes titleBounce {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-10px) scale(1.02); }
      }
      /* Custom Scrollbar for content areas */
      .kid-scroll::-webkit-scrollbar {
        width: 12px;
      }
      .kid-scroll::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 10px;
      }
      .kid-scroll::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 10px;
      }
      .kid-scroll::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
    </style>

{

    "react": "https://aistudiocdn.com/react@^19.2.0",

</script>

</head>

</html>
