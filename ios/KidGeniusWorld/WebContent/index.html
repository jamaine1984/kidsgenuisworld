    <meta charset="UTF-8" />

    <title>Kid Genius World</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Comic Neue', cursive;
        overflow: hidden; /* Prevent scroll on the main world view */
        background-color: #e0f2fe;
      }
      h1, h2, h3, button {
        font-family: 'Fredoka', sans-serif;
      }
      /* 3D Transforms */
      .world-perspective {
        perspective: 1200px;
      }
      .world-plane {
        transform-style: preserve-3d;
        transform: rotateX(30deg) translateY(-50px) scale(0.9);
        transition: transform 0.5s ease;
      }
      .room-card {
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        transform-style: preserve-3d;
      }
      .room-card:hover {
        transform: translateY(-20px) scale(1.05);
      }
      .floating {
        animation: float 3s ease-in-out infinite;
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      /* Custom Scrollbar for content areas */
      .kid-scroll::-webkit-scrollbar {
        width: 12px;
      }
      .kid-scroll::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 10px;
      }
      .kid-scroll::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 10px;
      }
      .kid-scroll::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
    </style>
